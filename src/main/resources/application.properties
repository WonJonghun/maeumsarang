# \uD3EC\uD2B8 \uBC0F \uC778\uC99D\uC11C \uC124\uC815
server.port=8081
server.ssl.enabled=true
server.ssl.key-store=classpath:ssl/intranet.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=rkskekfk12
server.ssl.key-alias=intranet
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# \uB4DC\uB77C\uC774\uBC84
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy

# MSSQL
spring.datasource.url=jdbc:log4jdbc:${DB_URL};sendStringParametersAsUnicode=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

# MyBatis
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-actual-param-name=true

# JSP Engine
server.servlet.jsp.init-parameters.development=true

# Spring
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# \uC138\uC158
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

